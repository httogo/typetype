<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="/pwa-192x192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>TypeType - 英文打字练习</title>

    <!-- SEO Meta -->
    <meta name="description" content="TypeType - 免费英文打字练习应用。提升打字速度和准确率，支持离线使用、词频高亮、自定义词表、文章管理。">
    <meta name="keywords" content="打字练习,英文打字,typing practice,WPM,打字速度,词频,离线应用">
    <meta name="author" content="TypeType">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="TypeType - 英文打字练习">
    <meta property="og:description" content="免费英文打字练习应用，支持离线使用、词频高亮、自定义词表、智能暂停计时。">
    <meta property="og:url" content="https://typetype.vercel.app">
    <meta property="og:site_name" content="TypeType">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="TypeType - 英文打字练习">
    <meta name="twitter:description" content="免费英文打字练习应用，支持离线使用、词频高亮、自定义词表。">

    <!-- 结构化数据 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TypeType",
      "description": "免费英文打字练习应用，支持离线使用、词频高亮、自定义词表、文章管理。",
      "url": "https://typetype.vercel.app",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CNY"
      }
    }
    </script>
  </head>
  <body>
    <script>
      // 在 React 加载前同步应用主题，防止闪烁
      (function() {
        try {
          var settings = JSON.parse(localStorage.getItem('typetype_settings'));
          if (settings && settings.theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
